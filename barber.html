<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divine Hair Salon – Barber Portal</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--ink:#f5f5f5;--mut:#a3a3a3;--line:#262626;--bad:#ef4444}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
main{max-width:600px;margin:0 auto;padding:24px 16px 48px}
h1{font-family:Georgia,serif;font-size:1.6rem;margin:0 0 16px;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.opt{flex:1;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:12px 10px;font:inherit;cursor:pointer;transition:all 0.2s}
.opt.on{border-color:#fff;background:#262626;color:#fff;font-weight:600}
input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:#000;color:var(--ink);font:inherit;margin-bottom:14px;outline:none}
input:focus{border-color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;display:flex;gap:16px;align-items:center}
.t{font-size:1.4rem;font-weight:700;min-width:70px;color:#fff}
.i{flex:1;min-width:0}.i b{display:block;font-size:1.05rem;color:#fff}.i span{color:var(--mut);font-size:0.9rem}
a{color:#fff;text-decoration:underline}
.x{background:none;border:1px solid var(--line);color:var(--bad);border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;transition:background 0.2s}
.x:hover{background:rgba(239,68,68,0.1)}
.d{color:var(--mut);font-size:0.75rem;letter-spacing:0.1em;text-transform:uppercase;margin:20px 0 8px;font-weight:600}
.msg{color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>Divine Hair Salon · Barber Portal</h1>
<div class="row" id="bf"></div>
<div class="row" id="df"></div>
<input id="q" placeholder="Type client name to look up reservation...">
<div id="list"></div>
<p class="msg" id="empty"></p>

<script>
let S={rows:[],b:"all",d:"today"};
const NM={sheriff:"Sheriff",fox:"Fox"};
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

async function load(){
  const r=await fetch("/api/bookings");
  S.rows=await r.json();
  render();
}

function render(){
  const bf=$("bf");bf.innerHTML="";
  [["all","Everyone"],["sheriff","Sheriff"],["fox","Fox"]].forEach(([v,l])=>{
    const e=document.createElement("button");e.className="opt"+(S.b===v?" on":"");e.textContent=l;
    e.onclick=()=>{S.b=v;render()};bf.append(e);
  });
  const df=$("df");df.innerHTML="";
  [["today","Today"],["tomorrow","Tomorrow"],["all","All upcoming"]].forEach(([v,l])=>{
    const e=document.createElement("button");e.className="opt"+(S.d===v?" on":"");e.textContent=l;
    e.onclick=()=>{S.d=v;render()};df.append(e);
  });

  const now=new Date(),td=ymd(now),tm=new Date();tm.setDate(tm.getDate()+1);const tmw=ymd(tm);
  const q=$("q").value.trim().toLowerCase();
  const rows=S.rows.filter(r=>(S.b==="all"||r.barber===S.b)&&(S.d==="all"||(S.d==="today"?r.date===td:r.date===tmw))&&(!q||r.name.toLowerCase().includes(q)));
  
  const L=$("list");L.innerHTML="";let last="";
  rows.forEach(r=>{
    if(S.d==="all"&&r.date!==last){last=r.date;const h=document.createElement("div");h.className="d";h.textContent=new Date(r.date+"T00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"});L.append(h)}
    const c=document.createElement("div");c.className="card";
    const t=document.createElement("div");t.className="t";t.textContent=r.time.slice(0,5);
    const i=document.createElement("div");i.className="i";
    const n=document.createElement("b");n.textContent=r.name;
    const s=document.createElement("span");s.textContent=NM[r.barber]+" · ";
    const a=document.createElement("a");a.href="tel:"+r.phone;a.textContent=r.phone;s.append(a);
    i.append(n,s);
    const x=document.createElement("button");x.className="x";x.textContent="Clear";
    x.onclick=async()=>{if(!confirm("Remove booking for "+r.name+"?"))return;
      await fetch("/api/bookings/"+r.id,{method:"DELETE"});load()};
    c.append(t,i,x);L.append(c);
  });
  $("empty").textContent=rows.length?"":"No reservations found.";
}

$("q").oninput=render;
load();
setInterval(load,20000);
</script>
</main>
</body>
</html>
